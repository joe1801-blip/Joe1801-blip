<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Minigame animado: Jonathan Tiburcio, Engenharia de Software e Cibersegurança" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.18"/>
    </pattern>
    <g id="city" fill="#0f1b3d">
      <rect x="0" y="170" width="60" height="55"/><rect x="70" y="150" width="45" height="75"/>
      <rect x="130" y="180" width="70" height="45"/><rect x="215" y="140" width="50" height="85"/>
      <rect x="280" y="165" width="65" height="60"/><rect x="360" y="155" width="40" height="70"/>
      <rect x="415" y="175" width="75" height="50"/><rect x="505" y="145" width="55" height="80"/>
      <rect x="575" y="170" width="60" height="55"/><rect x="650" y="150" width="45" height="75"/>
      <rect x="710" y="180" width="70" height="45"/><rect x="795" y="160" width="55" height="65"/>
      <rect x="860" y="175" width="40" height="50"/>
    </g>
  </defs>
  <style>
    text{font-family:'Courier New',Courier,monospace;font-weight:bold}
    .run{animation:run 6s linear infinite}
    .run2{animation:run 6s linear infinite;animation-delay:-3s}
    @keyframes run{from{transform:translateX(950px)}to{transform:translateX(-60px)}}
    .jump{animation:jump 6s ease-in-out infinite}
    @keyframes jump{
      0%,23.3%{transform:translateY(0)}
      30%{transform:translateY(-65px)}
      36.7%,73.3%{transform:translateY(0)}
      80%{transform:translateY(-65px)}
      86.7%,100%{transform:translateY(0)}
    }
    .legA{animation:legA .3s steps(1) infinite}
    .legB{animation:legB .3s steps(1) infinite}
    @keyframes legA{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes legB{0%{transform:translateY(-4px)}50%{transform:translateY(0)}}
    .dash{animation:dash .35s linear infinite}
    @keyframes dash{from{stroke-dashoffset:0}to{stroke-dashoffset:50}}
    .cityMove{animation:city 14s linear infinite}
    @keyframes city{from{transform:translateX(0)}to{transform:translateX(-900px)}}
    .twinkle{animation:tw 2s ease-in-out infinite}
    .twinkle2{animation:tw 2s ease-in-out infinite;animation-delay:-1s}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    .coin{animation:coin 6s linear infinite}
    .coin2{animation:coin 6s linear infinite;animation-delay:-3s}
    @keyframes coin{0%,78%{opacity:1}79%,100%{opacity:0}}
    .s1{animation:s1 6s steps(1) infinite}
    .s2{animation:s2 6s steps(1) infinite}
    .s3{animation:s3 6s steps(1) infinite}
    @keyframes s1{0%{opacity:1}30%{opacity:0}100%{opacity:0}}
    @keyframes s2{0%{opacity:0}30%{opacity:1}80%{opacity:0}100%{opacity:0}}
    @keyframes s3{0%{opacity:0}80%{opacity:1}100%{opacity:1}}
    .blink{animation:bl 1s steps(1) infinite}
    @keyframes bl{0%{opacity:1}50%{opacity:0}}
    .spin{animation:spin 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.2)}}
  </style>

  <rect width="900" height="280" rx="14" fill="url(#sky)"/>

  <!-- estrelas -->
  <g fill="#fff">
    <circle class="twinkle" cx="60" cy="30" r="1.8"/><circle class="twinkle2" cx="180" cy="50" r="1.5"/>
    <circle class="twinkle" cx="330" cy="22" r="1.6"/><circle class="twinkle2" cx="520" cy="38" r="1.8"/>
    <circle class="twinkle" cx="690" cy="26" r="1.5"/><circle class="twinkle2" cx="810" cy="58" r="1.8"/>
    <circle class="twinkle" cx="870" cy="20" r="1.4"/>
  </g>

  <!-- cidade ao fundo -->
  <g class="cityMove"><use href="#city"/><use href="#city" x="900"/></g>

  <!-- HUD -->
  <text x="24" y="36" font-size="16" fill="#facc15" class="s1">SCORE 0000</text>
  <text x="24" y="36" font-size="16" fill="#facc15" class="s2">SCORE 0100</text>
  <text x="24" y="36" font-size="16" fill="#facc15" class="s3">SCORE 0200</text>
  <text x="876" y="36" font-size="14" fill="#67e8f9" text-anchor="end">FASE: CIBERSEGURANÇA 🔐</text>

  <!-- título -->
  <text x="450" y="84" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="3">JONATHAN TIBURCIO</text>
  <text x="450" y="112" font-size="16" fill="#93c5fd" text-anchor="middle" letter-spacing="2">ENGENHARIA DE SOFTWARE  •  CIBERSEGURANÇA</text>
  <text class="blink" x="450" y="138" font-size="13" fill="#facc15" text-anchor="middle">▶ PRESS START</text>

  <!-- chão -->
  <rect x="0" y="225" width="900" height="55" fill="#0a1230"/>
  <line x1="0" y1="225" x2="900" y2="225" stroke="#38bdf8" stroke-width="3"/>
  <line x1="0" y1="245" x2="900" y2="245" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="30 20" class="dash"/>
  <line x1="0" y1="262" x2="900" y2="262" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="14 26" class="dash"/>

  <!-- obstáculo 1: bug -->
  <g class="run">
    <g transform="translate(0,197)">
      <rect x="0" y="0" width="28" height="28" rx="5" fill="#ef4444"/>
      <rect x="5" y="7" width="7" height="7" fill="#fff"/><rect x="16" y="7" width="7" height="7" fill="#fff"/>
      <rect x="7" y="9" width="3" height="3" fill="#000"/><rect x="18" y="9" width="3" height="3" fill="#000"/>
      <rect x="6" y="19" width="16" height="3" fill="#7f1d1d"/>
      <path d="M4 0 L0 -7 M24 0 L28 -7" stroke="#ef4444" stroke-width="2"/>
      <text x="14" y="-12" font-size="10" fill="#fca5a5" text-anchor="middle">BUG</text>
    </g>
    <g class="coin"><g transform="translate(8,115)"><circle class="spin" cx="6" cy="6" r="9" fill="#facc15" stroke="#a16207" stroke-width="2"/><text x="6" y="10" font-size="11" fill="#713f12" text-anchor="middle">$</text></g></g>
  </g>

  <!-- obstáculo 2: vírus -->
  <g class="run2">
    <g transform="translate(0,197)">
      <rect x="0" y="0" width="28" height="28" rx="14" fill="#a855f7"/>
      <path d="M14 -6 V0 M14 28 V34 M-6 14 H0 M28 14 H34 M-1 -1 L4 4 M29 -1 L24 4" stroke="#a855f7" stroke-width="3"/>
      <rect x="6" y="9" width="6" height="6" fill="#fff"/><rect x="16" y="9" width="6" height="6" fill="#fff"/>
      <rect x="8" y="11" width="3" height="3" fill="#000"/><rect x="18" y="11" width="3" height="3" fill="#000"/>
      <text x="14" y="-14" font-size="10" fill="#d8b4fe" text-anchor="middle">VÍRUS</text>
    </g>
    <g class="coin2"><g transform="translate(8,115)"><circle class="spin" cx="6" cy="6" r="9" fill="#facc15" stroke="#a16207" stroke-width="2"/><text x="6" y="10" font-size="11" fill="#713f12" text-anchor="middle">$</text></g></g>
  </g>

  <!-- jogador -->
  <g transform="translate(135,177)">
    <g class="jump">
      <rect x="5" y="-2" width="20" height="7" fill="#2b1b0e"/>
      <rect x="6" y="2" width="18" height="14" fill="#f1c27d"/>
      <rect x="9" y="7" width="3" height="3" fill="#000"/><rect x="18" y="7" width="3" height="3" fill="#000"/>
      <rect x="4" y="16" width="22" height="16" fill="#3b82f6"/>
      <rect x="0" y="17" width="5" height="11" fill="#f1c27d"/><rect x="25" y="17" width="5" height="11" fill="#f1c27d"/>
      <text x="15" y="28" font-size="9" fill="#fff" text-anchor="middle">&lt;/&gt;</text>
      <g class="legA"><rect x="6" y="32" width="8" height="12" fill="#1e293b"/><rect x="5" y="44" width="10" height="4" fill="#e2e8f0"/></g>
      <g class="legB"><rect x="16" y="32" width="8" height="12" fill="#1e293b"/><rect x="15" y="44" width="10" height="4" fill="#e2e8f0"/></g>
    </g>
  </g>

  <!-- efeito de tela retrô -->
  <rect width="900" height="280" rx="14" fill="url(#scan)"/>
  <rect x="2" y="2" width="896" height="276" rx="13" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
</svg>
